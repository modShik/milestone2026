<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Life Dashboard</title>
    <style>
      :root {
        --bg-dark: #0f172a;
        --glass-bg: rgba(30, 41, 59, 0.7);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;

        /* Intensity Scale */
        --lvl-0: #334155; /* Empty */
        --lvl-1: #ef4444; /* Terrible */
        --lvl-2: #f97316; /* Bad */
        --lvl-3: #eab308; /* Okay */
        --lvl-4: #22c55e; /* Good */
        --lvl-5: #3b82f6; /* Legendary */ /* Changed top tier to Blue for "Flow State" */
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
      }

      /* --- layout --- */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
      }

      /* --- Glassmorphism Cards --- */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 20px;
      }

      /* --- Sidebar (Profile & Stats) --- */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        height: fit-content;
      }

      .profile-header h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      .profile-header p {
        color: var(--text-muted);
        margin: 5px 0 0 0;
        font-size: 0.9rem;
      }

      .streak-box {
        text-align: center;
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 12px;
      }
      .streak-num {
        font-size: 2.5rem;
        font-weight: 800;
        display: block;
        line-height: 1;
      }
      .streak-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
      }
      .flame {
        color: #f59e0b;
        text-shadow: 0 0 10px #f59e0b;
      }

      /* --- Main Content --- */
      .main-content {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* --- Heatmap --- */
      .heatmap-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .heatmap-grid {
        display: grid;
        grid-template-columns: repeat(53, 1fr); /* Weeks */
        gap: 3px;
        height: 100px;
      }
      .heat-cell {
        background-color: var(--lvl-0);
        border-radius: 2px;
        width: 100%;
        height: 100%;
      }

      /* --- Monthly Calendar --- */
      .calendar-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--glass-border);
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
      }
      .day-name {
        text-align: center;
        color: var(--text-muted);
        font-size: 0.8rem;
        padding-bottom: 10px;
      }
      .day-cell {
        aspect-ratio: 1;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        cursor: pointer;
        position: relative;
        transition: transform 0.1s;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      .day-cell:hover {
        transform: scale(1.05);
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .day-cell.empty {
        background: transparent;
        cursor: default;
      }

      /* Colors for cells */
      .c-1 {
        background: var(--lvl-1);
        color: white;
        box-shadow: 0 0 10px var(--lvl-1);
      }
      .c-2 {
        background: var(--lvl-2);
        color: white;
      }
      .c-3 {
        background: var(--lvl-3);
        color: black;
      }
      .c-4 {
        background: var(--lvl-4);
        color: black;
      }
      .c-5 {
        background: var(--lvl-5);
        color: white;
        box-shadow: 0 0 15px var(--lvl-5);
      }

      .has-note-dot {
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        position: absolute;
        bottom: 6px;
      }

      /* --- Editor Overlay --- */
      #editor {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 400px;
        background: #1e293b;
        border-left: 1px solid var(--glass-border);
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 30px;
        z-index: 100;
        box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
      }
      #editor.open {
        transform: translateX(0);
      }

      .level-select {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin: 20px 0;
      }
      .lvl-btn {
        aspect-ratio: 1;
        border-radius: 8px;
        border: 2px solid transparent;
        cursor: pointer;
        opacity: 0.5;
        transition: 0.2s;
      }
      .lvl-btn:hover {
        opacity: 0.8;
        transform: scale(1.1);
      }
      .lvl-btn.selected {
        opacity: 1;
        border-color: white;
        transform: scale(1.1);
      }

      textarea {
        flex: 1;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        color: white;
        padding: 15px;
        resize: none;
        font-family: inherit;
        margin-bottom: 20px;
      }
      textarea:focus {
        outline: none;
        border-color: var(--lvl-5);
      }

      .close-editor {
        position: absolute;
        top: 15px;
        left: -50px;
        background: #1e293b;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px 0 0 8px;
        cursor: pointer;
      }

      /* --- Responsive --- */
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }
        #editor {
          width: 100%;
        }
        .close-editor {
          left: 20px;
          top: 20px;
          background: transparent;
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="glass profile-header">
          <h1>2026 Dashboard</h1>
          <p>Consistency is key.</p>
        </div>

        <div class="glass">
          <div class="streak-box">
            <span class="streak-num" id="currentStreak">0</span>
            <span class="streak-label"
              ><span class="flame">🔥</span> Current Streak</span
            >
          </div>
          <div
            style="
              margin-top: 15px;
              display: flex;
              justify-content: space-between;
              font-size: 0.8rem;
              color: var(--text-muted);
            "
          >
            <span>Longest: <b id="maxStreak" style="color: white">0</b></span>
            <span
              >Total Days: <b id="totalDays" style="color: white">0</b></span
            >
          </div>
        </div>

        <div class="glass">
          <h3 style="margin-top: 0">Legend</h3>
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 8px;
              font-size: 0.85rem;
            "
          >
            <div style="display: flex; align-items: center; gap: 10px">
              <div
                style="
                  width: 12px;
                  height: 12px;
                  background: var(--lvl-5);
                  border-radius: 3px;
                "
              ></div>
              Legendary (Flow)
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <div
                style="
                  width: 12px;
                  height: 12px;
                  background: var(--lvl-4);
                  border-radius: 3px;
                "
              ></div>
              Good
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <div
                style="
                  width: 12px;
                  height: 12px;
                  background: var(--lvl-3);
                  border-radius: 3px;
                "
              ></div>
              Okay / Neutral
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <div
                style="
                  width: 12px;
                  height: 12px;
                  background: var(--lvl-2);
                  border-radius: 3px;
                "
              ></div>
              Bad
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <div
                style="
                  width: 12px;
                  height: 12px;
                  background: var(--lvl-1);
                  border-radius: 3px;
                "
              ></div>
              Terrible
            </div>
          </div>
        </div>

        <button class="btn" onclick="exportData()" style="width: 100%">
          Backup Data (JSON)
        </button>
        <input
          type="file"
          id="importFile"
          style="display: none"
          onchange="importData(this)"
        />
        <button
          class="btn"
          onclick="document.getElementById('importFile').click()"
          style="
            width: 100%;
            margin-top: 10px;
            background: transparent;
            border: 1px dashed #555;
          "
        >
          Import Data
        </button>
      </aside>

      <main class="main-content">
        <div class="glass heatmap-container">
          <h3 style="margin: 0; font-size: 0.9rem; color: var(--text-muted)">
            Yearly Overview
          </h3>
          <div class="heatmap-grid" id="heatmap"></div>
        </div>

        <div class="glass">
          <div class="calendar-controls">
            <h2 id="monthLabel" style="margin: 0">January</h2>
            <div>
              <button class="btn" onclick="changeMonth(-1)">←</button>
              <button class="btn" onclick="changeMonth(1)">→</button>
            </div>
          </div>

          <div class="calendar-grid">
            <div class="day-name">Sun</div>
            <div class="day-name">Mon</div>
            <div class="day-name">Tue</div>
            <div class="day-name">Wed</div>
            <div class="day-name">Thu</div>
            <div class="day-name">Fri</div>
            <div class="day-name">Sat</div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="glass">
          <h3 style="margin: 0 0 15px 0">Distribution</h3>
          <div
            style="
              display: flex;
              height: 20px;
              border-radius: 10px;
              overflow: hidden;
            "
            id="distributionBar"
          ></div>
        </div>
      </main>
    </div>

    <div id="editor">
      <button class="close-editor" onclick="closeEditor()">✕</button>
      <h2 id="editorDate">Jan 01</h2>

      <p style="color: var(--text-muted); font-size: 0.9rem">How was today?</p>

      <div class="level-select">
        <div
          class="lvl-btn"
          style="background: var(--lvl-1)"
          onclick="setScore(1)"
        ></div>
        <div
          class="lvl-btn"
          style="background: var(--lvl-2)"
          onclick="setScore(2)"
        ></div>
        <div
          class="lvl-btn"
          style="background: var(--lvl-3)"
          onclick="setScore(3)"
        ></div>
        <div
          class="lvl-btn"
          style="background: var(--lvl-4)"
          onclick="setScore(4)"
        ></div>
        <div
          class="lvl-btn"
          style="background: var(--lvl-5)"
          onclick="setScore(5)"
        ></div>
      </div>
      <div
        style="
          text-align: center;
          margin-bottom: 20px;
          font-size: 0.8rem;
          color: var(--text-muted);
          cursor: pointer;
        "
        onclick="setScore(0)"
      >
        Clear / Reset
      </div>

      <p style="color: var(--text-muted); font-size: 0.9rem">Journal / Log</p>
      <textarea
        id="editorNote"
        placeholder="What did you accomplish? Why was it a good/bad day?"
      ></textarea>

      <button
        class="btn"
        style="
          background: var(--lvl-5);
          border: none;
          color: white;
          font-weight: bold;
        "
        onclick="saveEntry()"
      >
        Save Entry
      </button>
    </div>

    <script>
      const STORAGE_KEY = "life_dashboard_2026";
      let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

      const today = new Date();
      let currentMonth = today.getMonth(); // 0-11
      let currentYear = 2026;

      // Current Editor State
      let activeDateKey = null;
      let activeScore = 0;

      const months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];

      // --- Initialization ---
      function init() {
        renderHeatmap();
        renderCalendar();
        updateStats();
      }

      // --- Render Functions ---
      function renderHeatmap() {
        const grid = document.getElementById("heatmap");
        grid.innerHTML = "";

        // Generate all days for 2026
        const start = new Date(2026, 0, 1);
        const end = new Date(2026, 11, 31);

        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
          const key = formatDate(d);
          const data = db[key] || { score: 0 };

          const cell = document.createElement("div");
          cell.className = "heat-cell";
          if (data.score > 0)
            cell.style.backgroundColor = `var(--lvl-${data.score})`;
          cell.title = `${key}: Level ${data.score}`;
          grid.appendChild(cell);
        }
      }

      function renderCalendar() {
        const grid = document.getElementById("calendarGrid");
        const label = document.getElementById("monthLabel");
        grid.innerHTML = ""; // Clear previous days, keep headers

        label.innerText = `${months[currentMonth]} ${currentYear}`;

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(
          currentYear,
          currentMonth + 1,
          0
        ).getDate();

        // Padding
        for (let i = 0; i < firstDay; i++) {
          const pad = document.createElement("div");
          pad.className = "day-cell empty";
          grid.appendChild(pad);
        }

        // Days
        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(currentYear, currentMonth, d);
          const key = formatDate(dateObj);
          const data = db[key] || { score: 0, note: "" };

          const cell = document.createElement("div");
          cell.className = `day-cell ${
            data.score > 0 ? "c-" + data.score : ""
          }`;
          cell.innerText = d;
          cell.onclick = () => openEditor(key);

          if (data.note) {
            const dot = document.createElement("div");
            dot.className = "has-note-dot";
            cell.appendChild(dot);
          }

          // Highlight today if relevant
          const nowStr = formatDate(new Date());
          if (key === nowStr && currentYear === new Date().getFullYear()) {
            cell.style.border = "2px solid white";
          }

          grid.appendChild(cell);
        }
      }

      function updateStats() {
        // Streaks & Counts
        let currentStreak = 0;
        let maxStreak = 0;
        let tempStreak = 0;
        let totalDays = 0;
        let counts = [0, 0, 0, 0, 0, 0]; // 0-5

        const start = new Date(2026, 0, 1);
        const todayDate = new Date();
        // Cap analysis at today so we don't break streaks for future empty days
        const end =
          todayDate.getFullYear() === 2026 ? todayDate : new Date(2026, 11, 31);

        // Loop strictly for 2026 dates up to now
        for (
          let d = new Date(start);
          d <= new Date(2026, 11, 31);
          d.setDate(d.getDate() + 1)
        ) {
          const key = formatDate(d);
          const val = db[key] ? db[key].score : 0;

          if (val > 0) {
            totalDays++;
            counts[val]++;
            tempStreak++;
          } else {
            if (d < todayDate) tempStreak = 0; // Only reset if day has passed
          }

          if (tempStreak > maxStreak) maxStreak = tempStreak;
        }

        // Calculate current streak specifically backwards from today
        let s = 0;
        let checkDate = new Date(); // Start today
        if (checkDate.getFullYear() !== 2026)
          checkDate = new Date(2026, 11, 31); // Or end of 2026

        while (true) {
          const k = formatDate(checkDate);
          // If today has no entry yet, don't break streak, just skip counting it
          if (k === formatDate(new Date()) && (!db[k] || db[k].score === 0)) {
            checkDate.setDate(checkDate.getDate() - 1);
            continue;
          }

          if (db[k] && db[k].score > 0) {
            s++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
          if (checkDate.getFullYear() < 2026) break;
        }
        currentStreak = s;

        // Update DOM
        document.getElementById("currentStreak").innerText = currentStreak;
        document.getElementById("maxStreak").innerText = maxStreak;
        document.getElementById("totalDays").innerText = totalDays;

        // Distribution Bar
        const bar = document.getElementById("distributionBar");
        bar.innerHTML = "";
        if (totalDays === 0) {
          bar.style.background = "#334155";
        } else {
          for (let i = 1; i <= 5; i++) {
            if (counts[i] > 0) {
              const seg = document.createElement("div");
              seg.style.width = (counts[i] / totalDays) * 100 + "%";
              seg.style.background = `var(--lvl-${i})`;
              bar.appendChild(seg);
            }
          }
        }
      }

      // --- Editor Logic ---
      function openEditor(key) {
        activeDateKey = key;
        const data = db[key] || { score: 0, note: "" };
        activeScore = data.score;

        document.getElementById("editorDate").innerText = new Date(
          key
        ).toDateString();
        document.getElementById("editorNote").value = data.note || "";

        updateEditorButtons();
        document.getElementById("editor").classList.add("open");
      }

      function setScore(n) {
        activeScore = n;
        updateEditorButtons();
      }

      function updateEditorButtons() {
        const btns = document.querySelectorAll(".lvl-btn");
        btns.forEach((b, index) => {
          if (index + 1 === activeScore) b.classList.add("selected");
          else b.classList.remove("selected");
        });
      }

      function saveEntry() {
        const note = document.getElementById("editorNote").value;
        if (activeScore === 0 && note.trim() === "") {
          delete db[activeDateKey];
        } else {
          db[activeDateKey] = { score: activeScore, note: note };
        }

        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));

        renderCalendar();
        renderHeatmap(); // Update global view
        updateStats();
        closeEditor();
      }

      function closeEditor() {
        document.getElementById("editor").classList.remove("open");
      }

      // --- Helper ---
      function changeMonth(dir) {
        currentMonth += dir;
        if (currentMonth > 11) {
          currentMonth = 0;
          currentYear++;
        }
        if (currentMonth < 0) {
          currentMonth = 11;
          currentYear--;
        }
        renderCalendar();
      }

      function formatDate(d) {
        return d.toISOString().split("T")[0];
      }

      function exportData() {
        const dataStr =
          "data:text/json;charset=utf-8," +
          encodeURIComponent(JSON.stringify(db));
        const downloadAnchorNode = document.createElement("a");
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "life_dashboard_2026.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
      }

      function importData(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            db = JSON.parse(e.target.result);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            location.reload();
          } catch (err) {
            alert("Invalid JSON");
          }
        };
        reader.readAsText(file);
      }

      // Run
      init();
    </script>
  </body>
</html>
